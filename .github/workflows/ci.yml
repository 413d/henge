name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'site-tests/**'
      - 'docs/**'
      - '*.md'
      - 'Casks/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'site-tests/**'
      - 'docs/**'
      - '*.md'
      - 'Casks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, build, and package
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Validate scripts, Info.plist, and Xcode project
        run: |
          bash -n scripts/build.sh scripts/package.sh scripts/dev/build-local.sh
          test -x scripts/build.sh
          test -x scripts/package.sh
          plutil -lint App/Info.plist Henge.xcodeproj/project.pbxproj

      - name: Run tests (arm64)
        run: swift test

      - name: Run tests (x86_64 via Rosetta)
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 swift test
          else
            swift test
          fi

      - name: Build Xcode project
        run: xcodebuild -project Henge.xcodeproj -scheme Henge -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build universal app and package
        run: ./scripts/package.sh

      - name: Verify archive checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Verify extracted archive bundle
        run: |
          TMP_DIR="$(mktemp -d /tmp/henge-verify.XXXXXX)"
          ditto -x -k dist/Henge-universal.zip "${TMP_DIR}/"
          codesign --verify --deep --strict --verbose=2 "${TMP_DIR}/Henge.app"
          lipo "${TMP_DIR}/Henge.app/Contents/MacOS/Henge" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${TMP_DIR}/Henge.app/Contents/Info.plist"
          test -f "${TMP_DIR}/Henge.app/Contents/Resources/HengeMenuBar.png"
          rm -rf "${TMP_DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: henge-macos-universal
          path: |
            dist/Henge-universal.zip
            dist/SHA256SUMS.txt
            dist/LICENSE.txt
          if-no-files-found: error
          retention-days: 14
