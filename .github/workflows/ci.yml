name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Validate scripts and Info.plist
        run: |
          bash -n scripts/build.sh scripts/package.sh scripts/dev/build-local.sh
          test -x scripts/build.sh
          test -x scripts/package.sh
          plutil -lint App/Info.plist

      - name: Run tests
        run: swift test

  package:
    name: Universal app bundle
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal app and package
        run: ./scripts/package.sh

      - name: Verify archive checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Verify bundle signature and architecture
        run: |
          codesign --verify --deep --strict --verbose=2 "build/universal/Henge.app"
          lipo "build/universal/Henge.app/Contents/MacOS/Henge" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "build/universal/Henge.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: henge-macos-universal
          path: |
            dist/Henge-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
