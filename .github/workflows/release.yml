name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish GitHub Release
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      archive_sha256: ${{ steps.publish.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Validate scripts, Cask, and Info.plist
        run: |
          bash -n scripts/build.sh scripts/package.sh scripts/install.sh scripts/release/update-cask.sh scripts/dev/build-local.sh
          test -x scripts/build.sh
          test -x scripts/package.sh
          test -x scripts/install.sh
          test -x scripts/release/update-cask.sh
          ruby -c Casks/henge.rb
          plutil -lint App/Info.plist

      - name: Run tests (arm64)
        run: swift test

      - name: Run tests (x86_64 via Rosetta)
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 swift test
          else
            swift test
          fi

      - name: Derive release version and archive name
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "error: tag '${TAG}' must match SemVer format vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          RAW_VERSION="${TAG#v}"
          APP_VERSION="${RAW_VERSION%%-*}"
          ARCHIVE_NAME="Henge-${TAG}-universal.zip"
          PRERELEASE="false"
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE="true"
          fi
          {
            echo "tag=${TAG}"
            echo "app_version=${APP_VERSION}"
            echo "archive_name=${ARCHIVE_NAME}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build universal app and package
        env:
          HENGE_VERSION: ${{ steps.meta.outputs.app_version }}
          HENGE_BUILD_NUMBER: ${{ github.run_number }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
        run: ./scripts/package.sh --archive-name "${ARCHIVE_NAME}"

      - name: Verify archive checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Verify extracted archive bundle
        env:
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          TMP_DIR="$(mktemp -d /tmp/henge-release-verify.XXXXXX)"
          ditto -x -k "dist/${ARCHIVE_NAME}" "${TMP_DIR}/"
          codesign --verify --deep --strict --verbose=2 "${TMP_DIR}/Henge.app"
          lipo "${TMP_DIR}/Henge.app/Contents/MacOS/Henge" -verify_arch arm64 x86_64
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${TMP_DIR}/Henge.app/Contents/Info.plist")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${TMP_DIR}/Henge.app/Contents/Info.plist")"
          test "${ACTUAL_BUNDLE_ID}" = "io.github.413d.Henge"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"
          test -f "${TMP_DIR}/Henge.app/Contents/Resources/HengeMenuBar.png"
          test -f "${TMP_DIR}/INSTALL.txt"
          rm -rf "${TMP_DIR}"

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          NOTES_FILE="$(mktemp /tmp/henge-release-notes.XXXXXX)"
          trap 'rm -f "${NOTES_FILE}"' EXIT

          cat <<'EOF' > "${NOTES_FILE}"
          ## Henge __TAG__ (macOS Universal: Apple Silicon + Intel)

          ### Quick Install (macOS 13+)

          **Homebrew (recommended — clears Gatekeeper quarantine automatically):**
          ```bash
          brew tap 413d/henge https://github.com/413d/henge
          brew install --cask 413d/henge/henge
          ```

          **One-line installer (verifies SHA-256 checksum & code signature):**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/413d/henge/main/scripts/install.sh | bash
          ```

          ### Manual Installation (`__ARCHIVE_NAME__`)

          This release is built via GitHub Actions and **ad-hoc signed** (not notarized with a paid Apple Developer ID).

          1. Download `__ARCHIVE_NAME__` (includes `Henge.app` and bilingual `INSTALL.txt`).
          2. *(Optional)* Verify checksum against `SHA256SUMS.txt`:
             ```bash
             shasum -a 256 -c SHA256SUMS.txt
             ```
          3. Unzip and move `Henge.app` to `/Applications/` (or `~/Applications/`).
          4. **Allow first launch in macOS Gatekeeper** (choose either option):
             - **Without Terminal (Apple's official method):** Try opening `Henge.app` once and click **Done**, then open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway**.
             - **Via Terminal:**
               ```bash
               xattr -dr com.apple.quarantine ~/Applications/Henge.app
               # or, if moved to /Applications:
               xattr -dr com.apple.quarantine /Applications/Henge.app
               ```
          5. Launch `Henge.app` and enable **Accessibility** access in **System Settings → Privacy & Security → Accessibility**.

          ---
          EOF

          sed -i '' -e "s|__TAG__|${TAG}|g" -e "s|__ARCHIVE_NAME__|${ARCHIVE_NAME}|g" "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/${ARCHIVE_NAME}" \
              "dist/INSTALL.txt" \
              "dist/SHA256SUMS.txt" \
              "dist/LICENSE.txt" \
              --clobber
            EXISTING_BODY="$(gh release view "${TAG}" --json body -q '.body // ""' || true)"
            if [[ -z "${EXISTING_BODY//[[:space:]]/}" ]]; then
              gh release edit "${TAG}" \
                --title "Henge ${TAG}" \
                --notes-file "${NOTES_FILE}"
            fi
          else
            EXTRA_ARGS=()
            if [[ "${PRERELEASE}" == "true" ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "${TAG}" \
              "dist/${ARCHIVE_NAME}" \
              "dist/INSTALL.txt" \
              "dist/SHA256SUMS.txt" \
              "dist/LICENSE.txt" \
              --verify-tag \
              --title "Henge ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi

          ARCHIVE_SHA256="$(awk -v f="${ARCHIVE_NAME}" '$2 == f || $2 == "*"f { print $1; exit }' dist/SHA256SUMS.txt)"
          if [[ ! "${ARCHIVE_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "error: invalid or missing SHA-256 '${ARCHIVE_SHA256}' for ${ARCHIVE_NAME}" >&2
            exit 1
          fi
          echo "archive_sha256=${ARCHIVE_SHA256}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Published Henge ${TAG}"
              echo ""
              echo "- Archive: \`${ARCHIVE_NAME}\`"
              echo "- SHA-256: \`${ARCHIVE_SHA256}\`"
              if [[ "${PRERELEASE}" != "true" ]]; then
                echo "- Homebrew Cask (\`Casks/henge.rb\`): automatically synced on \`main\` by \`update-cask\` job."
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  update-cask:
    name: Update Homebrew Cask on main
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-update-cask-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update and push Casks/henge.rb
        env:
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          ARCHIVE_SHA256: ${{ needs.release.outputs.archive_sha256 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            ./scripts/release/update-cask.sh --no-downgrade "${APP_VERSION}" "${ARCHIVE_SHA256}"

            if git diff --quiet -- Casks/henge.rb; then
              echo "Casks/henge.rb is already up to date (or newer than ${APP_VERSION})."
              exit 0
            fi

            git add Casks/henge.rb
            git commit -m "chore(cask): bump henge to ${APP_VERSION}"

            if git push origin HEAD:refs/heads/main; then
              echo "Pushed Casks/henge.rb update for ${APP_VERSION} to main."
              exit 0
            fi

            echo "Push attempt ${attempt} failed due to concurrent main update; retrying..." >&2
            sleep 2
          done

          echo "error: failed to push Casks/henge.rb update to main after 3 attempts" >&2
          exit 1
