name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages configuration
        id: check_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/pages" || true)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ GitHub Pages is not yet enabled"
              echo ""
              echo "To deploy the landing page:"
              echo "1. If this repository is private, ensure Pages is allowed or make the repository public."
              echo "2. Go to **Settings → Pages** in your repository."
              echo "3. Under **Build and deployment → Source**, select **GitHub Actions**."
              echo "4. Re-run this workflow via **Actions → Deploy GitHub Pages → Run workflow** (workflow_dispatch)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        if: steps.check_pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
